version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR per ecosystem rather than a dozen — this is a small app and the
      # dependencies move together anyway.
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # eslint-config-next bundles typescript-eslint, which does not support
      # the TS 7.0 API — a major bump here fails lint and blocks every other
      # dev dependency in the group. Drop this once upstream ships support:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Same shape, different package: eslint-config-next bundles
      # eslint-plugin-react, whose peer range stops at eslint ^9.7. On ESLint 10
      # it throws "contextOrFilename.getFilename is not a function" from
      # react/display-name, so the whole dev group fails lint. Drop this once
      # eslint-plugin-react declares support for ESLint 10 in its peer range.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Otherwise every action bump is its own PR.
      github-actions:
        patterns: ["*"]
