version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR per ecosystem rather than a dozen — this is a small app and the
      # dependencies move together anyway.
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # eslint-config-next bundles typescript-eslint, which does not support
      # the TS 7.0 API — a major bump here fails lint and blocks every other
      # dev dependency in the group. Drop this once upstream ships support:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Otherwise every action bump is its own PR.
      github-actions:
        patterns: ["*"]
